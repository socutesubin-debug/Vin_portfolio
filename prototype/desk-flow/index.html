<meta charset="utf-8">
<title>VIN 책상 흐름</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* layout: 깔끔한 일러스트 책상 한 장면. 카메라가 홈 → 서랍 → 파일 쏟아짐 → 프로젝트 → 전화 순서로 이동하고, 글자는 HTML이 위에 뜬다 */
:root{
  --bg:#5b4fee;       /* 배경(청보라) */
  --ink:#0f0f18;      /* 선·그림자·글자 */
  --mid:#cfd0ee;      /* 중간톤 */
  --white:#fff;
  --display:"Jost","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Noto Sans KR",system-ui,sans-serif}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;transition:filter .6s,transform .6s}
#c.b{filter:blur(16px) brightness(.9);transform:scale(1.06)}
header{position:fixed;top:0;left:0;right:0;z-index:8;display:flex;justify-content:space-between;align-items:center;pointer-events:none;
 padding:calc(20px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));font-family:var(--display)}
.logo{font-weight:500;font-size:17px;letter-spacing:.02em}
nav{display:flex;gap:clamp(14px,3vw,30px);font:500 clamp(12px,1.3vw,15px) var(--display);letter-spacing:.04em;pointer-events:auto}
nav a{color:var(--ink);text-decoration:none;padding-bottom:2px;border-bottom:2px solid transparent;cursor:pointer}
nav a:hover,nav a:focus-visible,nav a.on{border-bottom-color:var(--ink);outline:none}
#label{position:fixed;z-index:59;left:0;top:0;pointer-events:none;font:500 12px "Noto Sans KR",var(--display);letter-spacing:.04em;background:var(--ink);color:#fff;box-shadow:0 0 0 1.5px #fff;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .15s;white-space:nowrap}
#hint{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));font:500 13px var(--display);letter-spacing:.04em;color:var(--ink);text-align:center;max-width:calc(100vw - 48px);transition:opacity .3s;text-shadow:0 0 8px #fff,0 0 3px #fff}
#back,#snd{all:unset;cursor:pointer;box-sizing:border-box;position:fixed;z-index:9;font:500 13px var(--display);letter-spacing:.04em;color:#fff}
#back{display:none!important}/* 화면의 Back 버튼은 숨김(Esc·스크롤 위로는 그대로 동작) */
#dl{all:unset;cursor:pointer;box-sizing:border-box;position:fixed;z-index:9;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));width:38px;height:38px;display:grid;place-items:center;background:var(--ink);box-shadow:0 0 0 2px #fff,3px 4px 0 2px rgba(0,0,0,.25)}
#dl:focus-visible{outline:2px solid #fff;outline-offset:4px}
#cur{position:fixed;left:0;top:0;z-index:60;pointer-events:none;opacity:0;will-change:transform}
#cur::before{content:"";position:absolute;left:-11px;top:-11px;width:22px;height:22px;box-sizing:border-box;border-radius:50%;border:2px solid var(--ink);background:rgba(255,255,255,.55);box-shadow:0 0 0 1.5px #fff;transition:width .18s,height .18s,left .18s,top .18s,background .18s}
#cur.on::before{left:-22px;top:-22px;width:44px;height:44px;background:var(--ink)}
#cur svg{position:absolute;left:-10px;top:-10px;width:20px;height:20px;opacity:0;transition:opacity .15s}
#cur.on svg{opacity:1}
html.cc,html.cc *{cursor:none!important}
html.cc input,html.cc textarea{cursor:text!important}
#back:hover,#back:focus-visible,#snd:focus-visible{outline:2px solid #fff;outline-offset:4px}
#snd{left:max(24px,env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:38px;height:38px;border-radius:50%;background:rgba(15,15,24,.55);display:grid;place-items:center}
#snd[aria-pressed="true"]{background:#fff;color:var(--ink)}
[hidden]{display:none!important}
/* 프로젝트 화면 */
#pj{position:fixed;inset:0;z-index:6;overflow:auto;overscroll-behavior:contain;opacity:0;pointer-events:none;
 padding:calc(78px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(170px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
#pj.on{opacity:1;pointer-events:auto}
#pj{background:rgba(34,26,40,.58);-webkit-backdrop-filter:blur(26px) saturate(.9);backdrop-filter:blur(26px) saturate(.9);color:#fff;backface-visibility:hidden;box-shadow:0 14px 40px rgba(0,0,0,.3)}
#call{background:none}
#sheet2{position:fixed;inset:0;z-index:5;display:none;background:rgba(34,26,40,.5);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);backface-visibility:hidden}
#pj h1{margin:0;text-align:center;font:300 clamp(38px,5vw,56px) var(--display);letter-spacing:.01em;color:#fff}
#chips{display:flex;gap:8px;justify-content:center;margin:16px 0 26px;flex-wrap:wrap}
#chips button{all:unset;cursor:pointer;font:400 15px var(--display);padding:7px 15px;border:1.5px solid rgba(255,255,255,.85);color:#fff;border-radius:999px;display:flex;gap:7px;align-items:center;transition:background .2s,color .2s}
#chips button small{font-size:10px;opacity:.8}
#chips button:hover{background:rgba(255,255,255,.18)}#chips button[aria-pressed="true"]{background:#fff;color:#221a28}
#chips button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#grid{max-width:940px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 24px}
.card{display:grid;gap:12px;cursor:pointer;color:#fff;text-decoration:none}
.card .th{aspect-ratio:1.55;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.28);display:grid;place-items:center;color:var(--ink);font:500 12px var(--display);letter-spacing:.14em;opacity:1;transition:transform .2s}
.card:hover .th,.card:focus-visible .th{transform:translate(-2px,-2px)}
.card .nm{display:flex;justify-content:space-between;align-items:center;font:500 19px var(--display)}.card .nm small{display:block;margin-top:3px;font:400 14px "Noto Sans KR",var(--display);opacity:.85}.card .nm .ar{font-size:26px;font-weight:300}
.card:focus-visible{outline:2px solid #fff;outline-offset:6px}body.pjOn header .logo,body.pjOn nav a{color:#fff}body.pjOn nav a:hover,body.pjOn nav a.on{border-bottom-color:#fff}
#toContact{all:unset;cursor:pointer;display:block;margin:46px auto 0;font:500 14px var(--display);letter-spacing:.06em;padding:13px 26px;background:var(--ink);color:#fff;box-shadow:4px 5px 0 #3f8fd8}
#toContact:focus-visible{outline:2px solid #fff;outline-offset:4px}
#end{text-align:center;margin-top:44px;font:400 14px var(--display);opacity:.9;color:#fff}
/* 모니터 화면 */
#mon{position:fixed;z-index:4;left:0;top:0;width:0;height:0;display:none;background:#0c0c12;color:var(--ink);overflow:hidden;transform-origin:50% 50%;border-radius:.12em}
#mon.on{display:flex;flex-direction:column;animation:crt .9s cubic-bezier(.3,.8,.3,1) both,bgOn .55s .55s ease-out both}
@keyframes bgOn{from{background:#0c0c12}to{background:#f7f1e3}}
@keyframes crt{0%{transform:scale(.02,.008);background:#fff;filter:brightness(2)}30%{transform:scale(1,.008)}65%{transform:scale(1,1);filter:brightness(1.6)}100%{transform:none;filter:none}}
#mon .bar{display:flex;align-items:center;gap:.6em;padding:.45em .8em;background:#e6dcc6;border-bottom:.08em solid var(--ink);opacity:0;animation:fadeIn .4s .75s forwards}
#mon .dots i{display:inline-block;width:.6em;height:.6em;border-radius:50%;margin-right:.3em;border:.08em solid var(--ink)}
#mon .dots i:nth-child(1){background:#db4a3e}#mon .dots i:nth-child(2){background:#f0b93f}#mon .dots i:nth-child(3){background:#3f8fd8}
#mon .url{flex:1;background:#fff;border:.08em solid var(--ink);border-radius:99em;padding:.15em .8em;font:500 .8em var(--display)}
#mon .tabs{display:flex;gap:.4em;padding:.5em .8em 0;opacity:0;animation:fadeIn .4s .85s forwards}
#mon .tabs button{all:unset;cursor:pointer;font:500 .8em "Noto Sans KR";padding:.35em 1em;border:.08em solid var(--ink);border-bottom:0;border-radius:.5em .5em 0 0;background:#e6dcc6}
#mon .tabs button[aria-selected="true"]{background:#fff}
#mon .tabs button:focus-visible{outline:.12em solid #3f8fd8}
#mon .doc{flex:1;overflow:auto;background:#fff;margin:0 .8em .8em;border:.08em solid var(--ink);padding:1.2em 1.6em;font:400 .82em/1.65 "Noto Sans KR";opacity:0;animation:fadeIn .5s 1s forwards;overscroll-behavior:contain}
#mon .doc h2{font:600 1.6em var(--display);margin:0 0 .2em}#mon .doc h3{font:700 .95em "Noto Sans KR";margin:1.2em 0 .3em;padding-bottom:.2em;border-bottom:.08em solid var(--ink)}
#mon .doc .ex{display:inline-block;font:500 .75em var(--display);background:#f0b93f;padding:.1em .6em;border-radius:99em;margin-bottom:.6em}
#mon .doc ul{margin:0;padding-left:1.1em}#mon .doc p{margin:.4em 0}
@keyframes fadeIn{to{opacity:1}}
/* 명함 */
#bc{position:fixed;inset:0;z-index:7;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s;background:rgba(255,255,255,.35);perspective:1400px}
#bc.on{opacity:1;pointer-events:auto}
#bc .cd{width:min(86vw,460px);aspect-ratio:9/5;position:relative;transform-style:preserve-3d}
#bc.on .cd{animation:cardIn .9s cubic-bezier(.25,.9,.3,1) both}
@keyframes cardIn{0%{transform:translateY(40vh) scale(.25) rotateX(70deg)}100%{transform:none}}
#bc .spin{position:absolute;inset:0;transform-style:preserve-3d}#bc{touch-action:none}
#bc .f{position:absolute;inset:0;backface-visibility:hidden;border-radius:6px;overflow:hidden;box-shadow:8px 10px 0 var(--ink);background:#f7f1e3;border:1.5px solid var(--ink)}
#bc .f img{width:100%;height:100%;object-fit:cover;display:block}
#bc .b{transform:rotateY(180deg)}
#bc .ph{position:absolute;inset:0;display:grid;align-content:space-between;padding:7% 8%;font:500 14px var(--display);color:var(--ink)}
#bc .ph b{font:600 clamp(26px,5vw,38px) var(--display);letter-spacing:.02em}
#bc .b .ph{background:#3f8fd8;color:#fff}
#bc p.tip{position:absolute;bottom:calc(84px + env(safe-area-inset-bottom,0px));font:500 13px var(--display);margin:0}
/* 띠링 */
#rings{position:fixed;inset:0;z-index:5;pointer-events:none;overflow:hidden}
#rings span{position:absolute;font:400 clamp(20px,2.6vw,30px) "Jua",sans-serif;color:#db4a3e;-webkit-text-stroke:1px var(--ink);paint-order:stroke;white-space:nowrap;animation:ding 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes ding{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(var(--r))}25%{opacity:1;transform:translate(calc(-50% + var(--dx)*.6),calc(-50% + var(--dy)*.6)) scale(1.1) rotate(var(--r))}75%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1) rotate(var(--r))}}
/* 프로젝트 상세 (원형 전환) */
#detail{position:fixed;inset:0;z-index:12;background:#f7f1e3;color:var(--ink);overflow:auto;overscroll-behavior:contain;clip-path:circle(0px at 50% 50%);visibility:hidden;scroll-behavior:auto}
#dBar{position:fixed;top:0;left:0;right:0;z-index:3;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:calc(10px + env(safe-area-inset-top,0px)) max(20px,3vw) 10px;background:rgba(247,241,227,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1.5px solid var(--ink)}
#dBar .ty{font:500 12px var(--display);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
#dBar .ty b{display:block;font:500 15px var(--display);letter-spacing:0;text-transform:none;color:#3f8fd8}
#dChips{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#dChips::-webkit-scrollbar{display:none}
#dChips button{all:unset;cursor:pointer;flex:none;font:500 13px var(--display);padding:6px 12px;border:1.5px solid transparent;border-radius:99px;white-space:nowrap;display:flex;gap:6px;transition:background .2s,color .2s,border-color .2s}
#dChips button i{font-style:normal;opacity:.55}
#dChips button:hover{border-color:var(--ink)}
#dChips button[aria-current="true"]{background:var(--ink);color:#fff}
#dChips button[aria-current="true"] i{opacity:.7}
#dChips button:focus-visible{outline:2px solid #3f8fd8;outline-offset:2px}
#dRight{display:flex;align-items:center;gap:14px}
#dPct{font:500 15px var(--display);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
#dClose{all:unset;cursor:pointer;font:500 13px var(--display);padding:8px 15px;background:var(--ink);color:#fff;border-radius:99px;white-space:nowrap}
#dClose:focus-visible{outline:2px solid #3f8fd8;outline-offset:3px}
#dProg{position:absolute;left:0;bottom:-1.5px;height:4px;width:0;background:#3f8fd8}
#dBody{padding-top:78px}
#dBody section{scroll-margin-top:70px}
.dw{max-width:1120px;margin:0 auto;padding:0 max(22px,5vw)}
.dk{font:500 12px var(--display);letter-spacing:.16em;text-transform:uppercase;color:#3f8fd8;display:flex;gap:10px;align-items:center;margin-bottom:18px}
.dk::after{content:"";height:1.5px;width:44px;background:currentColor;opacity:.5}
.ph{display:grid;place-items:center;text-align:center;font:500 12px var(--display);letter-spacing:.14em;color:rgba(15,15,24,.55);background:repeating-linear-gradient(135deg,rgba(15,15,24,.05) 0 10px,transparent 10px 20px),#efe6d0;border:1.5px solid var(--ink)}
.ph.b{background:#3f8fd8;color:#fff}.ph.r{background:#db4a3e;color:#fff}.ph.y{background:#f0b93f;color:var(--ink)}.ph.k{background:var(--ink);color:#f7f1e3}
/* UX / Web — Case Study */
.ux .sec{padding:84px 0;border-bottom:1.5px solid rgba(15,15,24,.14)}
.ux h2{font:500 clamp(30px,4.6vw,52px)/1.15 var(--display);margin:0 0 22px;letter-spacing:-.01em}
.ux p{font:400 16px/1.85 "Noto Sans KR";margin:0 0 14px;max-width:62ch}
.ux .hero{padding:56px 0 64px;border-bottom:1.5px solid rgba(15,15,24,.14)}
.ux .hero h1{font:500 clamp(40px,7vw,84px)/1.05 var(--display);margin:6px 0 24px;letter-spacing:-.02em}
.ux .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:34px 0 40px;border-top:1.5px solid var(--ink);padding-top:16px}
.ux .meta div{font:400 14px/1.6 "Noto Sans KR"}.ux .meta b{display:block;font:500 11px var(--display);letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin-bottom:4px}
.ux .cover{aspect-ratio:16/8.5;box-shadow:8px 10px 0 var(--ink)}
.ux .split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.ux .split.rev>:first-child{order:2}
.ux .split .ph{aspect-ratio:4/3;box-shadow:6px 7px 0 var(--ink)}
.ux .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
.ux .cards div{border:1.5px solid var(--ink);background:#fff;padding:22px;font:400 14px/1.7 "Noto Sans KR"}
.ux .cards b{display:block;font:500 28px var(--display);margin-bottom:8px;color:#db4a3e}
.ux .quote{font:500 clamp(22px,3vw,34px)/1.4 var(--display);max-width:28ch;border-left:5px solid #db4a3e;padding-left:22px;margin:0 0 30px}
.ux .steps{display:grid;gap:70px;margin-top:30px}
.ux .steps .st{display:grid;grid-template-columns:70px 1fr 1.15fr;gap:30px;align-items:center}
.ux .steps .st>span{font:500 54px var(--display);color:#3f8fd8;line-height:1}
.ux .steps .ph{aspect-ratio:16/10}
.ux .screens{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px}
.ux .screens .ph{aspect-ratio:9/16;border-radius:22px;box-shadow:5px 6px 0 var(--ink)}
.ux .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:28px 0}
.ux .stats div{background:var(--ink);color:#f7f1e3;padding:26px;font:400 14px/1.6 "Noto Sans KR"}.ux .stats b{display:block;font:500 clamp(36px,5vw,56px) var(--display);color:#f0b93f}
/* Branding — Visual Archive */
.br .sec{padding:140px 0}
.br h2{font:300 clamp(40px,7vw,96px)/1.02 var(--display);margin:0 0 30px;letter-spacing:-.025em}
.br p{font:400 15px/1.9 "Noto Sans KR";max-width:44ch;margin:0}
.br .full{width:100%;aspect-ratio:16/9;border:0}
.br .hero{padding:0}.br .hero .full{aspect-ratio:16/8.5;min-height:56vh}
.br .hero .cap{display:flex;justify-content:space-between;gap:20px;padding:22px max(22px,5vw);font:500 12px var(--display);letter-spacing:.16em;text-transform:uppercase}
.br .hero h1{font:300 clamp(40px,8vw,112px)/1 var(--display);margin:0;letter-spacing:-.035em;padding:56px max(22px,5vw) 28px;word-break:keep-all}
.br .concept{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:end}
.br .concept h2{margin:0}
.br .row2{display:grid;grid-template-columns:7fr 5fr;gap:28px;margin-top:70px;align-items:end}
.br .row2 .ph{aspect-ratio:4/5}.br .row2 .ph:first-child{aspect-ratio:5/4}
.br .pal{display:grid;grid-template-columns:repeat(4,1fr);height:min(60vh,460px);margin-top:50px;border:1.5px solid var(--ink)}
.br .pal div{display:flex;align-items:flex-end;padding:16px;font:500 13px var(--display);letter-spacing:.06em}
.br .type{display:grid;gap:22px;margin-top:40px;border-top:1.5px solid var(--ink);padding-top:30px}
.br .type .big{font:300 clamp(80px,18vw,240px)/.9 var(--display);letter-spacing:-.04em}
.br .type small{font:400 15px/1.8 "Noto Sans KR";max-width:52ch}
.br .gal{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;margin-top:40px}
.br .gal .ph{min-height:200px}
.br .g1{grid-column:span 8;aspect-ratio:16/10}.br .g2{grid-column:span 4;aspect-ratio:3/4}.br .g3{grid-column:span 4;aspect-ratio:1}.br .g4{grid-column:span 8;aspect-ratio:16/10}.br .g5{grid-column:span 12;aspect-ratio:21/9}
.br .closing{text-align:center;padding:160px 0}.br .closing h2{margin:0 auto 26px}.br .closing p{margin:0 auto}
@media (max-width:760px){
 #dBar{grid-template-columns:1fr auto;gap:8px 12px}#dChips{grid-column:1/-1;order:3;justify-content:flex-start}
 #dChips button{padding:5px 9px}#dChips button span{display:none}#dChips button[aria-current="true"] span{display:inline}
 #dBar .ty b{font-size:14px}#dBody{padding-top:104px}#dBody section{scroll-margin-top:100px}
 .ux .meta,.ux .cards,.ux .stats{grid-template-columns:1fr 1fr}.ux .split,.ux .steps .st{grid-template-columns:1fr}.ux .split.rev>:first-child{order:0}.ux .steps .st>span{font-size:36px}.ux .screens{gap:10px}.ux .sec{padding:56px 0}
 .br .sec{padding:80px 0}.br .concept,.br .row2{grid-template-columns:1fr;gap:34px}.br .pal{grid-template-columns:1fr 1fr;height:auto}.br .pal div{min-height:120px}.br .gal{gap:10px}.br .g1,.br .g4{grid-column:span 12}.br .g2,.br .g3{grid-column:span 6}
}
/* 엔딩 */
#mon .endv{display:none;flex:1;margin:0 .8em .8em;background:#fff;border:.08em solid var(--ink);flex-direction:column;align-items:center;justify-content:center;gap:.5em;text-align:center;padding:1em}
#mon.end .tabs,#mon.end .doc{display:none}#mon.end .bar{display:none}#mon.end{border-radius:0}#mon.end .endv{margin:0;border:0;background:#fff6e0}#mon.end .endv{display:flex}
#mon .endv .ok{width:3.2em;height:3.2em;border-radius:50%;background:#3fae6a;color:#fff;display:grid;place-items:center;font:700 1.9em var(--display);animation:pop .6s .9s both cubic-bezier(.3,1.6,.5,1)}
#mon .endv h2{margin:.2em 0 0;font:600 2.8em var(--display)}#mon .endv p{margin:0;font:400 1.3em/1.6 "Noto Sans KR"}
#mon .endv button{all:unset;cursor:pointer;margin-top:.6em;font:500 1.25em var(--display);padding:.7em 1.6em;background:var(--ink);color:#fff;box-shadow:.3em .35em 0 #3f8fd8}
#mon .endv>*:not(.ok){opacity:0;animation:fadeIn .5s 1.2s forwards}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}

cl:`<p class="quote">“작업의 이유를 고민하고, 아이디어를 경험으로 구현하는 디자이너, 박수빈입니다.”</p>
<h3>01 성장과정 | 패션에서 UXUI 디자인으로, 영역을 넓히다</h3><p>저는 관심이 생긴 분야를 직접 배우고 경험하며 할 수 있는 작업을 하나씩 늘려왔습니다.</p><p>고등학교 시절 패션동아리를 만들고 패션쇼를 기획한 경험을 계기로 패션디자인을 전공했습니다. 이후 패션디자이너로 근무하며 의상 디자인뿐 아니라 그래픽 디자인과 품질관리(QC), 작업지시서 작성등 다양한 실무를 경험했습니다. 그 중 그래픽 디자인 작업에 가장 큰 흥미를 느꼈고, 시각적 표현의 가능성을 더 넓은 가능성을 탐구하고자 한국폴리텍대학교 시각디자인과에 진학했습니다.</p><p>입학 후에는 수업을 통해 그래픽 디자인을 넘어 UXUI 디자인과 웹사이트 제작까지 작업 영역을 확장했습니다. SRT와 프린트카페 리뉴얼 프로젝트에서는 기존 서비스를 분석하고 사용자에게 필요한 기능과 화면 구조를 설계했습니다. 또한 르라보 프로모션 웹사이트를 제작하면서 기획한 화면을 직접 코딩하고, AI 도구를 활용해 구현과 수정 과정을 반복했습니다.</p><p>이러한 경험은 디자인을 바라보는 관점에 변화를 가져왔습니다. 이전에는 시각적으로 완성도 높은 결과물을 만드는 데 집중했다면, 이제는 리서치를 바탕으로 사용자의 요구를 파악하고, 어떤 경험을 제공할 것인지 기획하며, 이를 어떻게 효과적으로 전달하고 설득할 것인지까지 고민하게 되었습니다.</p><p>앞으로 지금까지 쌓아 온 시각적 표현 능력을 바탕으로 <b>기획과 설계, 구현까지 폭넓게 이해하며 사용자의 일상에 실질적인 가치를 더하는 디자이너</b>로 성장하고 싶습니다.</p>
<h3>02 직무역량 | ‘무엇을’, ‘어떻게’, ‘왜’ 라는 것을 고민하는 디자이너</h3><p>패션디자이너로 근무하던 때, 처음 작성한 작업지시서에서 여러 수정 사항에 대한 피드백을 받았습니다. 이후 다음 시즌에는 같은 문제가 발생하지 않도록 이전 시즌의 자료와 새로운 작업 내용을 반복해서 비교하고 검토했습니다. 그 결과 업무의 정확성이 좋아졌다는 긍정적인 평가를 받을 수 있었습니다. 이 일을 계기로 주어진 일을 잘 해내는 것뿐 아니라, 상대방이 무엇을 원하고 왜 요청했는지 이해하는 것도 중요하다는 것을 알게 되었습니다.</p><p>이후 디자인을 시작할 때도 바로 작업을 시작하기보다 그 이유를 먼저 생각하는 습관이 생겼습니다. 르라보 프로모션을 기획할 때는 [매거진B] 르라보 편을 읽으며 브랜드에 대해 공부했습니다. 인상 깊은 내용을 노트에 적어가며 살펴보던 중, 향을 하나의 이미지나 언어로 정의하기보다 각자의 경험과 해석을 존중한다는 점이 특히 마음에 남았습니다.</p><p>그래서 브랜드의 와비사비 정신과 아날로그 감성을 웹사이트에도 담고 싶었습니다. 거친 질감과 오래된 물건에서 느껴지는 분위기를 이미지에 반영하고, 여백을 활용해 화면을 구성했습니다. 또한 매장에서 직접 볼 수 있는 블렌딩과 퍼스널 라벨링을 온라인에서도 경험할 수 있는 아이디어를 생각했습니다. 이를 바탕으로 사용자가 원료를 선택하고 자신만의 향수를 완성하는 과정을 기획하고, 스토리보드와 사용자 흐름을 그려 화면을 설계했습니다.</p><p>처음에는 원하는 화면과 움직임을 만드는 일이 쉽지 않았지만, 구현 방법을 찾아보고 결과를 확인하며 수정했습니다. 머릿 속의 아이디어를 실제로 작동하게 만드는 일이 얼마나 많은 고민과 노력이 필요한지 느꼈습니다. 동시에 직접 구상한 경험을 화면으로 만들어지는 과정에서 큰 성취감을 얻었습니다.</p><p>아직 익혀야 할 기술도, 경험해 보지 못한 작업도 많습니다. 하지만 작업의 이유를 먼저 생각하고, 모르는 것은 배우면서, 떠올린 아이디어를 실제 결과물로 만들어가는 태도는 앞으로도 이어가고 싶습니다.</p>
<h3>03 학교생활과 협동 | 서로 다른 의견을 하나의 방향으로</h3><p>저는 여러 사람이 함께 일할 때 중요한 것은 자신의 의견을 전달하는 것뿐 아니라, 상대방의 상황을 이해하고 함께 방향을 맞춰 가는 과정이라고 생각합니다.</p><p>과대표로 활동하며 15명의 학생이 참여하는 졸업전시의 전체 일정과 팀별 업무를 조율하고 있습니다. 배너팀, 영상팀, 웹팀의 진행 상황을 확인하고, 작업 범위와 필요한 인원을 고려해 팀원을 재배치하기도 했습니다.</p><p>동시에 웹팀의 팀장을 맡아 팀원들의 의견을 모아 제작 방향을 정하고, 각자의 강점과 역할을 고려해 비주얼, 코딩, 콘텐츠 세 팀으로 업무를 나누었습니다.</p><p>가장 어려웠던 점은 구성원마다 작업을 이해하는 방식과 진행 속도가 달랐다는 것입니다. 같은 내용을 전달해도 팀마다 다르게 받아들이는 경우가 있었고, 각자의 상황을 고려하며 일정을 조율하는 일도 쉽지 않았습니다. 처음에는 제가 충분히 설명했다고 생각했으나, 실제로는 상대방이 이해한 내용을 확인하는 과정이 부족했다는 것을 알게 되었습니다.</p><p>이후에는 팀원들의 의견과 진행 상황을 확인하고, 말로 설명하기 어려운 내용은 기획서와 와이어프레임, 페이지 구조도로 정리해 공유했습니다. 각 화면에 필요한 요소와 연결 방식을 시각적으로 보여주고, 이해가 다른 부분은 다시 설명하며 작업 방향을 조정했습니다.</p><p>이 경험을 통해 소통은 자신의 생각을 전달하는 데서 그치는 것이 아니라, 상대방의 입장을 듣고 서로 이해한 내용을 맞춰 가는 과정이라는 것을 배웠습니다. 또한 여러 사람이 함께 일할 때는 각자의 방식과 속도를 존중하면서도 공동의 목표를 놓치지 않는 태도가 필요하다는 것을 느꼈습니다.</p><p>앞으로도 동료들의 의견을 경청하고, 필요한 내용을 정확하게 공유하며 함께 일하기 편한 동료가 되고싶습니다.</p>
<h3>04 입사 후 포부 | 배움을 바탕으로 새로운 가능성을 만들어가는 디자이너</h3><p>저는 아이디어를 제안하는데 그치지 않고, 구체적인 결과물로 보여줄 수 있는 디자이너가 되고 싶습니다.</p><p>입사 초기에는 회사의 디자인 방향과 작업 방식을 익히고, 맡은 업무를 정확하게 수행하는 데 집중하겠습니다. 학교의 프로젝트와 달리 실무에서는 일정과 제작 환경, 다양한 사람들의 요구를 함께 고려해야 한다고 생각합니다. 따라서 작업의 목적을 먼저 확인하고, 피드백을 받아 부족한 부분을 수정하며 실무에 적응하겠습니다.</p><p>업무에 익숙해진 뒤에는 주어진 요구사항을 수행하는 것에서 한 걸음 더 나아가고 싶습니다. 기존의 방식에서 개선할 부분이나 새로운 가능성을 찾아 아이디어를 제안하고, 직접 자료를 조사하고 시안을 제작하며 실현할 방법을 고민하겠습니다. 동료들과 의견을 나누며 실제로 적용할 수 있는 방법까지 고민하겠습니다.</p><p>배움에 대한 열정이 있습니다. 맡은 일을 책임감 있게 수행하고 피드백을 통해 보완해 나가겠습니다. 무엇보다 소통과 협업을 중요하게 여기며, 동료들이 믿고 함께 일할 수 있는 디자이너가 되겠습니다.</p>`};
const mon=$('mon');
// 모니터 화면 그림: 좌표는 1600×900 기준으로 그리고, 실제 픽셀은 SS배(큰 화면에서 2560×1440)로 선명하게
const AW=1600,AH=900,SS=Math.min(innerWidth,innerHeight*1.78)*Math.min(devicePixelRatio||1,2)>=1800?1.6:1,abPage=document.createElement('canvas');abPage.width=AW*SS;abPage.height=AH*SS;
const abC=document.createElement('canvas');abC.width=AW*SS;abC.height=AH*SS;
const abTex=new THREE.CanvasTexture(abC);abTex.colorSpace=THREE.SRGBColorSpace;abTex.anisotropy=8;
const ABM=new THREE.MeshBasicMaterial({map:abTex});
const sS=new THREE.Scene(),scrO=new THREE.Mesh(scr.geometry,new THREE.MeshBasicMaterial({map:abTex,toneMapped:false,depthTest:false,depthWrite:false}));scrO.matrixAutoUpdate=false;scrO.frustumCulled=false;sS.add(scrO);
if(sS.matrixWorldAutoUpdate!==undefined)sS.matrixWorldAutoUpdate=false;
let abTab='cv',abStart=0,abWas=false,abDirty=true,abDone=false;
// ── WORK(모니터): 프로젝트를 한 개씩 보여 주는 화면 (시안 work page) ──
// 가운데 눈금 막대가 굴러가며 01 → 02, 분류·이름·연도가 바뀐다. 스크롤/막대 클릭/자동(3.4초)으로 넘어감
// 나중에 표지 이미지가 오면 가운데 빈 공간에 넣을 예정
const WP=[
 {t:'프린트카페 UI 리뉴얼',c:'UXUI',g:'UXUI',y:'2026',img:'printcafe',url:'printcafe/'},
 {t:'Tower28 상세페이지 리디자인',c:'PROMOTION',g:'WEB',y:'2026',img:'tower28'},
 {t:'큐시락토 상세페이지 리디자인',c:'PROMOTION',g:'WEB',y:'2026',img:'qsilacto'},
 {t:'템페스트 리플렛 리디자인',c:'EDITORIAL',g:'GRAPHIC',y:'2025',img:'tempest'},
 {t:'다이소 뷰티 로고디자인',c:'BRANDING',g:'BRANDING',y:'2025',img:'daiso'},
 {t:'그루브라임 패션디자인',c:'FASHION',g:'GRAPHIC',y:'2025',img:'grooverhyme'},
 {t:'르망고 텍스타일 디자인',c:'TEXTILE',g:'GRAPHIC',y:'2024',img:'lemango'}];
const WCATS=['ALL','UXUI','WEB','BRANDING','GRAPHIC'],WDUR=700,wE=x=>1-Math.pow(1-x,3);
let wEdgeT=0,wCat='ALL',wI=0,wOld=0,wFrom=0,wT0=0,wAnim=false,wDir=1,wLastUser=0,wLastChange=0,wStepT=0,wkHK='',wkChipHov='';const WKR={chips:[],cy:450};
const wkList=()=>WP.filter(p=>wCat==='ALL'||p.g===wCat);
// 표지: 모니터용 판(-sm, 글자 없는 배경 그림)을 쓴다. 큰 판(.jpg)은 글자가 들어간 다른 구성이라 상세 화면용
const WIMG={};WP.forEach(p=>{const im=new Image();im.onload=()=>{WIMG[p.img]=im;if(st==='screen')wkRedraw()};im.src='covers/'+p.img+'-sm.jpg'});
$('wkA11y').innerHTML=WP.map(p=>`<button data-n="${p.t}" data-k="${p.c}" data-img="${p.img}" data-url="${p.url||''}">${p.t} (${p.c}, ${p.y}) 열기</button>`).join('');[...$('wkA11y').children].forEach(b=>b.onclick=e=>openDetail(b,e));
function wkRedraw(){abDirty=true;if(abDone)drawAbout(1)}
function wPosNow(){if(!wAnim)return wI;return wFrom+(wI-wFrom)*wE(Math.min(1,(performance.now()-wT0)/WDUR))}
function wkGoto(ni,wrap){const L=wkList();if(ni<0||ni>=L.length||ni===wI)return;wFrom=wrap?ni-1:wPosNow();wOld=wI;wDir=wrap||ni>wI?1:-1;wI=ni;wT0=performance.now();wAnim=true;wLastChange=wT0;wkRedraw()}
function wkTick(){const now=performance.now(),L=wkList();
 if(wAnim){if(now-wT0>=WDUR)wAnim=false;wkRedraw()}
 else if(L.length>1&&!dOpen&&!(hover&&hover.wk)&&now-wLastUser>6000&&now-wLastChange>3400)wkGoto((wI+1)%L.length,wI===L.length-1)}
function wkHit(px,py){for(const c of WKR.chips)if(px>=c.x&&px<=c.x+c.w&&py>=c.y&&py<=c.y+c.h)return{type:'chip',c:c.c,key:'c'+c.c};
 const cy=WKR.cy;if(px>=740&&px<=860&&py>=cy-120&&py<=cy+120){if(py<cy-14)return{type:'prev',key:'prev'};if(py>cy+14)return{type:'next',key:'next'}}
 if(px>=0&&px<=AW&&py>=0&&py<=AH)return{type:'open',key:'open'};return null}   /* 탭·이전/다음 막대 말고는 화면 어디를 눌러도 프로젝트 열기 */
function drawPage(){const g=abPage.getContext('2d');const KR='"Noto Sans KR", sans-serif',JO='Jost, "Noto Sans KR", sans-serif',L=wkList(),cy=WKR.cy;
 g.setTransform(SS,0,0,SS,0,0);g.imageSmoothingQuality='high';
 g.fillStyle='#444444';g.fillRect(0,0,AW,AH);
 {const bg=p=>p&&WIMG[p.img],kk=wAnim?wE(Math.min(1,(performance.now()-wT0)/WDUR)):1;if(wAnim&&bg(L[wOld]))g.drawImage(bg(L[wOld]),0,0,AW,AH);if(bg(L[wI])){g.globalAlpha=wAnim?kk:1;g.drawImage(bg(L[wI]),0,0,AW,AH);g.globalAlpha=1}}
 g.fillStyle='rgba(24,24,28,.12)';g.fillRect(0,0,AW,AH);   /* 표지 전체에 옅은 그레이톤 그림자(글자가 잘 보이게) */
 {const cy=WKR.cy;let gr=g.createLinearGradient(0,0,0,150);gr.addColorStop(0,'rgba(0,0,0,.38)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,AW,150);   // 위쪽 탭 뒤 옅은 그림자
  gr=g.createLinearGradient(0,cy-130,0,cy+130);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.5,'rgba(0,0,0,.34)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,cy-130,AW,260)}   // 가운데 줄 뒤 옅은 그림자
 g.shadowColor='rgba(0,0,0,.55)';g.shadowBlur=14;   // 글자·막대에 옅은 그림자
 // 분류 탭(가운데 정렬). 선택한 탭은 흰색 + 밑줄
 WKR.chips=[];g.font='500 24px '+JO;g.textBaseline='middle';g.textAlign='left';const gap=56,ws=WCATS.map(c=>g.measureText(c).width);
 let x=(AW-(ws.reduce((a,b)=>a+b,0)+gap*(WCATS.length-1)))/2;
 WCATS.forEach((c,i)=>{const on=c===wCat,hv=c===wkChipHov;g.fillStyle=on?'#fff':hv?'rgba(255,255,255,.85)':'rgba(255,255,255,.5)';g.fillText(c,x,62);if(on)g.fillRect(x,80,ws[i],2);WKR.chips.push({c,x:x-14,y:36,w:ws[i]+28,h:52});x+=ws[i]+gap});
 const k=wAnim?wE(Math.min(1,(performance.now()-wT0)/WDUR)):1,pos=wAnim?wFrom+(wI-wFrom)*k:wI;
 // 가운데 눈금 막대: 현재 위치는 길고 밝게, 위아래는 짧고 흐리게. 프로젝트가 바뀌면 굴러간다
 const sp=26,cx=800;for(let j=-6;j<=6;j++){const n=Math.round(pos)+j,dist=Math.abs(n-pos);if(dist>4.2)continue;const t=Math.min(1,dist),w=92-34*t,h=5-t,a=dist>3?Math.max(0,1-(dist-3)/1.2):1;
  g.fillStyle=`rgba(232,232,232,${(1-.42*t)*a})`;g.fillRect(cx-w/2,cy+(n-pos)*sp-h/2,w,h)}

 // 번호 · 분류 · 이름 · 연도 (바뀔 때 이전 내용은 위로, 새 내용은 아래에서 올라오며 바뀜)

 story:`<h2>옷에서 화면으로</h2><p>관심이 생긴 분야를 직접 배우고 경험하며, 할 수 있는 작업을 하나씩 늘려 왔어요.</p>
<h3>01 · 패션을 시작하다</h3><p>고등학교 시절 패션동아리를 만들고 패션쇼를 기획한 경험을 계기로, 사사다 패션스쿨에서 패션디자인을 전공했어요.</p>
<h3>02 · 현장에서 일하다 (2024 – 2025)</h3><p>르망고·케이브랜즈 디자인팀에서 의류 그래픽·패턴 디자인, 트렌드 리서치, 품질관리(QC), 작업지시서 작성까지 경험했어요. 그중 그래픽 디자인에 가장 큰 흥미를 느꼈어요.</p>
<h3>03 · 새로운 도구를 익히다</h3><p>메타버스 기반 패션 크리에이터 과정(138시간)과 패션 3D CLO 과정(70시간)으로 디지털 속 옷과 경험을 다뤄 봤어요.</p>
<h3>04 · 화면을 설계하다 (2025 –)</h3><p>한국폴리텍대학 시각디자인과에 진학해 UXUI와 웹사이트 제작으로 영역을 넓혔어요. SRT·프린트카페 리뉴얼에서 서비스를 분석해 화면 구조를 설계했고, 르라보 프로모션 웹사이트는 직접 코딩하고 AI 도구로 구현과 수정을 반복했어요.</p>
<h3>그래서 지금은</h3><p>예전에는 보기 좋은 결과물에 집중했다면, 이제는 리서치로 사용자의 요구를 파악하고 어떤 경험을 줄지, 어떻게 전달하고 설득할지까지 고민해요.</p>`,
 work:`<h2>일하는 방식</h2><p>‘무엇을’, ‘어떻게’, ‘왜’를 먼저 고민해요.</p>
<h3>왜 요청했는지부터</h3><p>첫 작업지시서에서 받은 피드백을 다음 시즌에 되풀이하지 않으려고 이전 자료와 새 작업을 반복해서 비교·검토했어요. 그 뒤로 정확해졌다는 평가를 받았고, 상대가 무엇을 왜 원하는지 먼저 이해하는 습관이 생겼어요.</p>
<h3>브랜드를 공부하고 시작하기</h3><p>르라보 프로모션을 기획할 때 [매거진B] 르라보 편을 읽고 노트에 정리했어요. 와비사비 정신과 아날로그 감성을 거친 질감과 여백으로 화면에 담았어요.</p>
<h3>매장 경험을 화면으로</h3><p>매장의 블렌딩·퍼스널 라벨링을 온라인에서도 할 수 있도록, 원료를 고르고 나만의 향수를 완성하는 과정을 스토리보드와 사용자 흐름으로 설계했어요.</p>
<h3>보이게 공유하기</h3><p>졸업전시 웹팀 팀장으로, 말로 설명하기 어려운 내용은 기획서·와이어프레임·페이지 구조도로 정리해 공유했어요.</p>
<h3>쓰는 도구</h3><p>Photoshop · Illustrator · Figma · 3D CLO · AI 도구</p>`,
 taste:`<h2>취향 노트</h2><p>박수빈이 좋아하고, 자주 들여다보는 것들.</p>
<h3>요즘 자주 보는 것</h3><p class="todo">✎ 직접 채우기 — 브랜드·웹사이트·전시·책 3가지</p>
<h3>작업할 때 듣는 것</h3><p class="todo">✎ 직접 채우기 — 플레이리스트나 좋아하는 음악</p>
<h3>좋아하는 색과 재료</h3><p class="todo">✎ 직접 채우기 — 예: 코발트 블루, 거친 종이, 리넨 같은 패션 시절부터 좋아한 것</p>
<h3>영감을 얻는 곳</h3><p class="todo">✎ 직접 채우기 — 산책길·매장·전시장 등 아이디어가 떠오르는 장소</p>`,
 qa:`<h2>박수빈에게 묻다</h2>
<h3>Q. 디자이너로서 한 문장으로 소개한다면?</h3><p>작업의 이유를 고민하고, 아이디어를 경험으로 구현하는 디자이너예요.</p>
<h3>Q. 패션 경험이 UX/UI에 어떻게 쓰이나요?</h3><p>QC와 작업지시서를 다루며 익힌 정확함, 그리고 상대가 무엇을 왜 원하는지 먼저 이해하려는 습관이 그대로 이어져요.</p>
<h3>Q. 가장 애착 가는 작업은?</h3><p class="todo">✎ 직접 채우기 — 작업 이름과 이유 한두 줄</p>
<h3>Q. 함께 일하면 어떤 동료인가요?</h3><p>과대표로 15명 졸업전시를 조율하면서, 소통은 내 생각을 전하는 데서 끝나지 않고 서로 이해한 내용을 맞춰 가는 과정이라는 걸 배웠어요. 의견을 경청하고 필요한 내용을 정확하게 공유하는, 함께 일하기 편한 동료가 되고 싶어요.</p>
<h3>Q. 앞으로 만들고 싶은 것은?</h3><p>아이디어를 제안하는 데 그치지 않고, 구체적인 결과물로 보여 주는 디자이너가 되고 싶어요.</p>
<h3>연락하기</h3><p><a href="mailto:eilibean01@gmail.com">eilibean01@gmail.com</a></p><button class="go" data-go="contact">전화기로 메시지 남기기 →</button>`};
