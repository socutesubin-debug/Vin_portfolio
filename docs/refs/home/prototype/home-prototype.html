</style>
<canvas id="c" aria-label="두 가지 색으로 그린 책상 3D. 스탠드, 컴퓨터, 전화기, 명함, 컵, 서랍이 놓여 있어요. 사물을 누르면 가까이 봐요."></canvas>
<header><div class="logo">Vision INside</div><nav aria-label="주 메뉴"><a class="on" href="#home">HOME</a><a href="#about">ABOUT</a><a href="#work">WORK</a><a href="#contact">CONTACT</a></nav></header>

<div id="pal"></div>
<div id="load">LOADING</div>
<script src="models.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

PALS.forEach(([nm,d,l],i)=>{const b=document.createElement('button');b.setAttribute('aria-label',nm);b.title=nm;b.innerHTML=`<i style="background:${d}"></i><i style="background:${l}"></i>`;b.onclick=()=>setPal(i);pal.appendChild(b)});setPal(0);
document.getElementById('g1').oninput=e=>post.uniforms.gAmt.value=e.target.value/100;
